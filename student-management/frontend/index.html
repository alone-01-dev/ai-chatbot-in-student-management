<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Student Management System
        </h1>

        <div class="card p-4">

            <h3 class="mb-3">Add Student</h3>
            <div id="message"></div>
            <form id="studentForm">

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Name
                    </label>

                    <input type="text" id="name" required class="form-control" placeholder="Enter student name">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input type="email" id="email" required class="form-control" placeholder="Enter student email">
                </div>

                <div class="mb-3">
                    <label for="age" class="form-label">
                        Age
                    </label>

                    <input type="number" id="age" min="1" required class="form-control" placeholder="Enter student age">
                </div>

                <div class="mb-3">
                    <label for="department" class="form-label">
                        Department
                    </label>

                    <input type="text" id="department" required class="form-control" placeholder="Enter department">
                </div>

                <button type="submit" class="btn btn-primary" id="submitButton">
                    Add Student
                </button>
                <button type="button" class="btn btn-secondary ms-2" id="cancelButton" style="display: none;">
                    Cancel
                </button>

            </form>

        </div>

    </div>
   <div class="card p-4 mt-4">

    <h3 class="mb-3">Student List</h3>

    <div class="input-group mb-3">

        <input type="text"
               id="searchInput"
               class="form-control"
               placeholder="Search student by name">

        <button class="btn btn-primary"
                type="button"
                id="searchButton">
            Search
        </button>

        <button class="btn btn-secondary"
                type="button"
                id="showAllButton">
            Show All
        </button>

    </div>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Department</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTableBody">
        </tbody>

    </table>

</div>

    <script src="script.js"></script>

</body>

</html>
